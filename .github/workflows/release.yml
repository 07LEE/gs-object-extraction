name: Release

# Pushing a tag such as v0.2.1 tests the package and publishes a GitHub release with the wheel and sdist.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' pyproject.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the project version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip build
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,gui,images]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Build
        run: python -m build

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
